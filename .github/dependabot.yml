version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      avalonia:
        patterns:
          - "Avalonia*"
      reactive-ui-and-dock:
        patterns:
          - "ReactiveUI*"
          - "System.Reactive"
          - "Dock.*"
      test-platform:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
