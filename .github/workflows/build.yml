name: Build

on:
  push:
    branches:
      - main
      - master
      - develop
      - "feature/**"
      - "release/**"
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_FILE: XamlVisualEditor.slnx
  PACKAGE_ARTIFACT_NAME: ci-nuget-packages

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test unit
        run: dotnet test tests/XamlVisualEditor.Tests.Unit/XamlVisualEditor.Tests.Unit.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test/unit

      - name: Test integration
        timeout-minutes: 15
        run: dotnet test tests/XamlVisualEditor.Tests.Integration/XamlVisualEditor.Tests.Integration.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test/integration --blame-hang --blame-hang-timeout 5m

      - name: Test UI
        timeout-minutes: 15
        run: dotnet test tests/XamlVisualEditor.Tests.UI/XamlVisualEditor.Tests.UI.csproj -c Release --no-build --logger "trx;LogFileName=ui.trx" --results-directory artifacts/test/ui

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-${{ matrix.os }}
          path: artifacts/test/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish test results
        if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3.0.0
        with:
          name: Test Results (${{ matrix.os }})
          path: artifacts/test/**/*.trx
          reporter: dotnet-trx
          fail-on-empty: false

  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/XamlVisualEditor.Tests.Performance/XamlVisualEditor.Tests.Performance.csproj

      - name: Build
        run: dotnet build tests/XamlVisualEditor.Tests.Performance/XamlVisualEditor.Tests.Performance.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Test performance
        run: dotnet test tests/XamlVisualEditor.Tests.Performance/XamlVisualEditor.Tests.Performance.csproj -c Release --no-build --logger "trx;LogFileName=performance.trx" --results-directory artifacts/test/performance

      - name: Upload performance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-test-results
          path: artifacts/test/**/*.trx
          if-no-files-found: ignore
          retention-days: 7

  pack-nuget:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest
    needs: build-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Determine CI package version
        id: package-version
        shell: bash
        run: |
          version_prefix=$(dotnet msbuild src/XamlVisualEditor.Core/XamlVisualEditor.Core.csproj -getProperty:VersionPrefix)
          echo "version=${version_prefix}-ci.${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" -c Release --no-restore -p:Version="${{ steps.package-version.outputs.version }}" -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack "${{ env.SOLUTION_FILE }}" -c Release --no-build -p:Version="${{ steps.package-version.outputs.version }}" -p:ContinuousIntegrationBuild=true -o artifacts/packages

      - name: Validate sample extension packages
        run: |
          dotnet pack tools/ExtensionSamples/HelloExtension/HelloExtension.csproj -c Release -p:ContinuousIntegrationBuild=true -o artifacts/sample-packages
          dotnet pack tools/ExtensionSamples/LspExtension/LspExtension.csproj -c Release -p:ContinuousIntegrationBuild=true -o artifacts/sample-packages

      - name: Validate release packages and README badges
        run: ./eng/validate-release-packages.sh artifacts/packages "${{ steps.package-version.outputs.version }}"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 7

      - name: Upload sample extension packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-sample-extension-packages
          path: |
            artifacts/sample-packages/*.nupkg
            artifacts/sample-packages/*.snupkg
          if-no-files-found: error
          retention-days: 7
