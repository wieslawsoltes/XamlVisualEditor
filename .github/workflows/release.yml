name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0 or 0.1.0-preview.1"
        required: true
        type: string
      prerelease:
        description: "Mark the release as prerelease"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  APP_PROJECT: src/XamlVisualEditor.App/XamlVisualEditor.App.csproj
  SOLUTION_FILE: XamlVisualEditor.slnx
  PACKAGE_ARTIFACT_NAME: release-nuget-packages

jobs:
  version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag-name: ${{ steps.version.outputs.tag-name }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}

    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG_NAME="v${VERSION}"
            IS_PRERELEASE="${{ github.event.inputs.prerelease }}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            if [[ "${VERSION}" == *"-"* ]]; then
              IS_PRERELEASE="true"
            else
              IS_PRERELEASE="false"
            fi
          fi

          {
            echo "version=${VERSION}"
            echo "tag-name=${TAG_NAME}"
            echo "is-prerelease=${IS_PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" -c Release --no-restore -p:Version="${{ needs.version.outputs.version }}" -p:ContinuousIntegrationBuild=true

      - name: Test unit
        run: dotnet test tests/XamlVisualEditor.Tests.Unit/XamlVisualEditor.Tests.Unit.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test/unit -p:Version="${{ needs.version.outputs.version }}"

      - name: Test integration
        timeout-minutes: 15
        run: dotnet test tests/XamlVisualEditor.Tests.Integration/XamlVisualEditor.Tests.Integration.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test/integration -p:Version="${{ needs.version.outputs.version }}" --blame-hang --blame-hang-timeout 5m

      - name: Test UI
        timeout-minutes: 15
        run: dotnet test tests/XamlVisualEditor.Tests.UI/XamlVisualEditor.Tests.UI.csproj -c Release --no-build --logger "trx;LogFileName=ui.trx" --results-directory artifacts/test/ui -p:Version="${{ needs.version.outputs.version }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-results
          path: artifacts/test/**/*.trx
          if-no-files-found: ignore
          retention-days: 30

  publish-app:
    name: Publish App (${{ matrix.target.id }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    needs:
      - version
      - build-test
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: linux-x64
            runner: ubuntu-latest
            rid: linux-x64
          - id: win-x64
            runner: windows-latest
            rid: win-x64
          - id: macos-arm64
            runner: macos-14
            rid: osx-arm64

    env:
      ARTIFACT_NAME: XamlVisualEditor-${{ needs.version.outputs.version }}-${{ matrix.target.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish app
        run: dotnet publish "${{ env.APP_PROJECT }}" -c Release -r "${{ matrix.target.rid }}" --self-contained false -p:Version="${{ needs.version.outputs.version }}" -p:ContinuousIntegrationBuild=true -o "artifacts/publish/${{ env.ARTIFACT_NAME }}"

      - name: Archive app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/publish/$env:ARTIFACT_NAME/*" -DestinationPath "artifacts/$env:ARTIFACT_NAME.zip" -Force

      - name: Archive app (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "artifacts/publish/${ARTIFACT_NAME}"
          zip -r "../../${ARTIFACT_NAME}.zip" .

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 90

  pack-nuget:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest
    needs:
      - version
      - build-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" -c Release --no-restore -p:Version="${{ needs.version.outputs.version }}" -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack "${{ env.SOLUTION_FILE }}" -c Release --no-build -p:Version="${{ needs.version.outputs.version }}" -p:ContinuousIntegrationBuild=true -o artifacts/packages

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 90

  publish-nuget:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    needs:
      - pack-nuget
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Push packages to NuGet
        shell: bash
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::notice::NUGET_API_KEY is not configured; skipping NuGet publish."
            exit 0
          fi

          shopt -s nullglob
          for package in packages/*.nupkg packages/*.snupkg; do
            dotnet nuget push "$package" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - version
      - publish-app
      - pack-nuget
      - publish-nuget
    permissions:
      contents: write

    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Download NuGet packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag-name }}
          target_commitish: ${{ github.sha }}
          name: XamlVisualEditor v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.is-prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.nupkg
            release-assets/*.snupkg
