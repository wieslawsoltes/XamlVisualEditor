name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0 or 0.1.0-preview.1"
        required: true
        type: string
      prerelease:
        description: "Mark the release as prerelease"
        required: false
        type: boolean
        default: false

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  APP_PROJECT: src/XamlVisualEditor.App/XamlVisualEditor.App.csproj
  SOLUTION_FILE: XamlVisualEditor.slnx
  PACKAGE_ARTIFACT_NAME: release-nuget-packages

jobs:
  version:
    name: Determine Release Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag-name: ${{ steps.version.outputs.tag-name }}
      is-prerelease: ${{ steps.version.outputs.is-prerelease }}

    steps:
      - name: Determine version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${INPUT_VERSION}"
            TAG_NAME="v${VERSION}"
            IS_PRERELEASE="${INPUT_PRERELEASE}"
          else
            VERSION="${GITHUB_REF#refs/tags/v}"
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            IS_PRERELEASE="false"
          fi

          SEMVER_PATTERN='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "${VERSION}" =~ ${SEMVER_PATTERN} ]]; then
            echo "::error::Release version '${VERSION}' is not valid SemVer."
            exit 1
          fi

          if [[ "${VERSION}" == *"-"* ]]; then
            IS_PRERELEASE="true"
          fi

          {
            echo "version=${VERSION}"
            echo "tag-name=${TAG_NAME}"
            echo "is-prerelease=${IS_PRERELEASE}"
          } >> "${GITHUB_OUTPUT}"

  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: version
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" -c Release --no-restore -p:Version="${{ needs.version.outputs.version }}" -p:ContinuousIntegrationBuild=true

      - name: Test unit
        run: dotnet test tests/XamlVisualEditor.Tests.Unit/XamlVisualEditor.Tests.Unit.csproj -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory artifacts/test/unit -p:Version="${{ needs.version.outputs.version }}"

      - name: Test integration
        timeout-minutes: 15
        run: dotnet test tests/XamlVisualEditor.Tests.Integration/XamlVisualEditor.Tests.Integration.csproj -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory artifacts/test/integration -p:Version="${{ needs.version.outputs.version }}" --blame-hang --blame-hang-timeout 5m

      - name: Test UI
        timeout-minutes: 15
        run: dotnet test tests/XamlVisualEditor.Tests.UI/XamlVisualEditor.Tests.UI.csproj -c Release --no-build --logger "trx;LogFileName=ui.trx" --results-directory artifacts/test/ui -p:Version="${{ needs.version.outputs.version }}"

      - name: Test performance
        run: dotnet test tests/XamlVisualEditor.Tests.Performance/XamlVisualEditor.Tests.Performance.csproj -c Release --no-build --logger "trx;LogFileName=performance.trx" --results-directory artifacts/test/performance -p:Version="${{ needs.version.outputs.version }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-test-results
          path: artifacts/test/**/*.trx
          if-no-files-found: ignore
          retention-days: 30

  publish-app:
    name: Publish App (${{ matrix.target.id }})
    runs-on: ${{ matrix.target.runner }}
    timeout-minutes: 45
    needs:
      - version
      - build-test
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: linux-x64
            runner: ubuntu-latest
            rid: linux-x64
          - id: linux-arm64
            runner: ubuntu-latest
            rid: linux-arm64
          - id: win-x64
            runner: windows-latest
            rid: win-x64
          - id: win-arm64
            runner: windows-latest
            rid: win-arm64
          - id: macos-x64
            runner: macos-14
            rid: osx-x64
          - id: macos-arm64
            runner: macos-14
            rid: osx-arm64

    env:
      ARTIFACT_NAME: XamlVisualEditor-${{ needs.version.outputs.version }}-${{ matrix.target.id }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Publish app
        run: dotnet publish "${{ env.APP_PROJECT }}" -c Release -r "${{ matrix.target.rid }}" --self-contained false -p:Version="${{ needs.version.outputs.version }}" -p:ContinuousIntegrationBuild=true -o "artifacts/publish/${{ env.ARTIFACT_NAME }}"

      - name: Validate app archive contents
        shell: bash
        env:
          TARGET_RID: ${{ matrix.target.rid }}
        run: |
          output="artifacts/publish/${ARTIFACT_NAME}"
          required_files=(
            "${output}/XamlVisualEditor.App.dll"
            "${output}/XamlVisualEditor.App.deps.json"
            "${output}/XamlVisualEditor.App.runtimeconfig.json"
            "${output}/XamlVisualEditor.Designer.PreviewerHost.dll"
            "${output}/XamlVisualEditor.Designer.PreviewerHost.deps.json"
            "${output}/vscode-compat-host/host.js"
            "${output}/vscode-compat-host/jsonrpc.js"
            "${output}/README.md"
            "${output}/LICENSE"
            "${output}/CHANGELOG.md"
          )

          if [[ "${TARGET_RID}" == win-* ]]; then
            required_files+=(
              "${output}/XamlVisualEditor.App.exe"
              "${output}/XamlVisualEditor.Designer.PreviewerHost.exe"
            )
          else
            required_files+=(
              "${output}/XamlVisualEditor.App"
              "${output}/XamlVisualEditor.Designer.PreviewerHost"
            )
          fi

          for required_file in "${required_files[@]}"; do
            if [[ ! -s "${required_file}" ]]; then
              echo "::error::Required release file is missing or empty: ${required_file}"
              exit 1
            fi
          done

      - name: Archive app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "artifacts/publish/$env:ARTIFACT_NAME/*" -DestinationPath "artifacts/$env:ARTIFACT_NAME.zip" -Force

      - name: Archive app (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd "artifacts/publish/${ARTIFACT_NAME}"
          zip -r "../../${ARTIFACT_NAME}.zip" .

      - name: Upload app artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error
          retention-days: 90

  pack-nuget:
    name: Pack NuGet Packages
    runs-on: ubuntu-latest
    needs:
      - version
      - build-test
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "${{ env.SOLUTION_FILE }}"

      - name: Build
        run: dotnet build "${{ env.SOLUTION_FILE }}" -c Release --no-restore -p:Version="${{ needs.version.outputs.version }}" -p:ContinuousIntegrationBuild=true

      - name: Pack
        run: dotnet pack "${{ env.SOLUTION_FILE }}" -c Release --no-build -p:Version="${{ needs.version.outputs.version }}" -p:ContinuousIntegrationBuild=true -o artifacts/packages

      - name: Validate sample extension packages
        run: |
          dotnet pack tools/ExtensionSamples/HelloExtension/HelloExtension.csproj -c Release -p:ContinuousIntegrationBuild=true -o artifacts/sample-packages
          dotnet pack tools/ExtensionSamples/LspExtension/LspExtension.csproj -c Release -p:ContinuousIntegrationBuild=true -o artifacts/sample-packages

      - name: Validate release packages and README badges
        run: ./eng/validate-release-packages.sh artifacts/packages "${{ needs.version.outputs.version }}"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
          retention-days: 90

  publish-nuget:
    name: Publish NuGet Packages
    runs-on: ubuntu-latest
    needs:
      - pack-nuget
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    env:
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

    steps:
      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: packages

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Push packages to NuGet
        shell: bash
        run: |
          if [ -z "${NUGET_API_KEY}" ]; then
            echo "::error::NUGET_API_KEY is required for a release."
            exit 1
          fi

          shopt -s nullglob
          packages=(packages/*.nupkg)
          if [ ${#packages[@]} -eq 0 ]; then
            echo "::error::No NuGet packages were downloaded."
            exit 1
          fi

          for package in "${packages[@]}"; do
            dotnet nuget push "$package" \
              --api-key "${NUGET_API_KEY}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs:
      - version
      - publish-app
      - pack-nuget
      - publish-nuget
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download app artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: XamlVisualEditor-*
          path: release-assets
          merge-multiple: true

      - name: Download NuGet packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.PACKAGE_ARTIFACT_NAME }}
          path: release-assets

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum ./*.zip ./*.nupkg ./*.snupkg | sort -k 2 > SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.version.outputs.tag-name }}
          target_commitish: ${{ github.sha }}
          name: XamlVisualEditor v${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.is-prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*.zip
            release-assets/*.nupkg
            release-assets/*.snupkg
            release-assets/SHA256SUMS
